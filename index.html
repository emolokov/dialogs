<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат с ботом</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f2f5;
      height: 100vh;
    }
    .header {
      padding: 12px 16px;
      background: #0088cc;
      color: white;
      font-weight: 500;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .main-container {
      display: flex;
      height: calc(100vh - 44px);
      position: relative;
      overflow: hidden;
    }
    .users-list {
      width: 100%;
      background: white;
      overflow-y: auto;
      transition: transform 0.3s ease;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
    }
    .user-item {
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .user-item:hover {
      background-color: #f5f5f5;
    }
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #0088cc;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      font-weight: bold;
    }
    .user-name {
      font-weight: 500;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dialog-view {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: #e7ebf0;
    }
    .dialog-header {
      padding: 12px 16px;
      background: white;
      border-bottom: 1px solid #e2e2e2;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .back-button {
      margin-right: 12px;
      cursor: pointer;
      font-size: 20px;
    }
    .messages-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .message-group {
      margin-bottom: 16px;
    }
    .message {
      margin-bottom: 4px;
      max-width: 80%;
      position: relative;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .user-message {
      margin-left: auto;
      background: #e3f2fd;
      padding: 10px 14px;
      border-radius: 12px 12px 0 12px;
    }
    .bot-message {
      margin-right: auto;
      background: white;
      padding: 10px 14px;
      border-radius: 12px 12px 12px 0;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
    }
    .message-time {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
      text-align: right;
    }
    .scroll-down-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #0088cc;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 50;
      border: none;
      outline: none;
    }
    .scroll-down-btn.visible {
      opacity: 1;
    }
    .scroll-down-btn:hover {
      transform: scale(1.1);
    }
    .show-dialog .users-list {
      transform: translateX(-100%);
    }
    .show-dialog .dialog-view {
      display: flex;
    }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #888;
      text-align: center;
      padding: 20px;
    }
    .loading {
      padding: 20px;
      text-align: center;
      color: #888;
    }
    /* Markdown стили */
    .message-text pre {
      background-color: rgba(0,0,0,0.05);
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
      margin: 8px 0;
    }
    .message-text code {
      font-family: 'Courier New', monospace;
      background-color: rgba(0,0,0,0.05);
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 0.9em;
    }
    .message-text blockquote {
      border-left: 3px solid #ccc;
      padding-left: 10px;
      margin: 8px 0;
      color: #666;
    }
    .message-text table {
      border-collapse: collapse;
      width: 100%;
      margin: 10px 0;
    }
    .message-text th, .message-text td {
      border: 1px solid #ddd;
      padding: 6px 10px;
    }
    .message-text th {
      background-color: #f5f5f5;
    }
    .message-text ul, .message-text ol {
      padding-left: 20px;
      margin: 8px 0;
    }
    .message-text h1, .message-text h2, .message-text h3 {
      margin: 12px 0 8px 0;
    }
    .message-text a {
      color: #0088cc;
      text-decoration: none;
    }
    .message-text a:hover {
      text-decoration: underline;
    }
    .message-text img {
      max-width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="header">Диалоги с ботом</div>
  
  <div class="main-container" id="mainContainer">
    <div class="users-list" id="usersList">
      <div class="loading">Загрузка...</div>
    </div>
    
    <div class="dialog-view" id="dialogView">
      <div class="dialog-header">
        <div class="back-button" id="backButton">←</div>
        <div id="currentUserName">Диалог</div>
      </div>
      <div class="messages-container" id="messagesContainer">
        <div class="empty-state">
          <p>Загрузка сообщений...</p>
        </div>
      </div>
    </div>
  </div>

  <button class="scroll-down-btn" id="scrollDownBtn" title="К новым сообщениям">
    ↓
  </button>

  <script>
    const webApp = Telegram.WebApp;
    webApp.expand();
    webApp.enableClosingConfirmation();
    
    // Настройка Markdown парсера
    marked.setOptions({
      breaks: true,
      gfm: true,
      sanitize: true
    });
    
    let dialogs = {};
    let currentUser = null;
    let isAutoScrolled = true;
    
    function getAvatarLetter(username) {
      return username ? username.charAt(0).toUpperCase() : '?';
    }
    
    function formatTime(timestamp) {
      if (!timestamp) return '';
      try {
        if (timestamp.includes('.')) {
          const [datePart, timePart] = timestamp.split(' ');
          const [day, month, year] = datePart.split('.');
          return `${day}.${month}.${year} ${timePart || ''}`;
        }
        return timestamp;
      } catch {
        return timestamp;
      }
    }
    
    function renderMarkdown(text) {
      if (!text) return '';
      let html = marked.parse(text);
      // Открываем ссылки в новом окне
      html = html.replace(/<a href="/g, '<a target="_blank" rel="noopener noreferrer" href="');
      return html;
    }
    
    async function loadDialogs() {
      try {
        document.getElementById('usersList').innerHTML = '<div class="loading">Загрузка диалогов...</div>';
        
        const response = await fetch('https://airtable-proxy-worker.e92molokov.workers.dev/api/dialogs');
        if (!response.ok) throw new Error('Ошибка загрузки');
        
        dialogs = await response.json();
        
        // Сортируем диалоги по времени (новые сверху)
        const sortedDialogs = {};
        Object.keys(dialogs).forEach(username => {
          sortedDialogs[username] = dialogs[username].sort((a, b) => {
            return new Date(b.time) - new Date(a.time);
          });
        });
        dialogs = sortedDialogs;
        
        if (Object.keys(dialogs).length === 0) {
          document.getElementById('usersList').innerHTML = '<div class="empty-state">Нет диалогов</div>';
          return;
        }
        
        renderUserList();
        
      } catch (error) {
        console.error('Error loading dialogs:', error);
        document.getElementById('usersList').innerHTML = `
          <div class="empty-state">
            <p>Не удалось загрузить диалоги</p>
            <button onclick="location.reload()">Попробовать снова</button>
          </div>
        `;
      }
    }
    
    function renderUserList() {
      const usersList = document.getElementById('usersList');
      usersList.innerHTML = '';
      
      Object.keys(dialogs).forEach(username => {
        const userItem = document.createElement('div');
        userItem.className = 'user-item';
        userItem.innerHTML = `
          <div class="user-avatar">${getAvatarLetter(username)}</div>
          <div class="user-name">${username}</div>
        `;
        userItem.addEventListener('click', () => showUserDialog(username));
        usersList.appendChild(userItem);
      });
    }
    
    function showUserDialog(username) {
      currentUser = username;
      document.getElementById('currentUserName').textContent = username;
      document.getElementById('mainContainer').classList.add('show-dialog');
      
      const messagesContainer = document.getElementById('messagesContainer');
      messagesContainer.innerHTML = '';
      
      if (!dialogs[username] || dialogs[username].length === 0) {
        messagesContainer.innerHTML = '<div class="empty-state">Нет сообщений</div>';
        return;
      }
      
      const messagesFragment = document.createDocumentFragment();
      
      // Сортируем сообщения по времени (старые сверху, новые снизу)
      const sortedMessages = [...dialogs[username]].sort((a, b) => {
        return new Date(a.time) - new Date(b.time);
      });
      
      sortedMessages.forEach(msg => {
        const messageGroup = document.createElement('div');
        messageGroup.className = 'message-group';
        
        if (msg.prompt) {
          const userMsg = document.createElement('div');
          userMsg.className = 'message user-message';
          userMsg.innerHTML = `
            <div class="message-text">${renderMarkdown(msg.prompt)}</div>
            <div class="message-time">${formatTime(msg.time)}</div>
          `;
          messageGroup.appendChild(userMsg);
        }
        
        if (msg.answer) {
          const botMsg = document.createElement('div');
          botMsg.className = 'message bot-message';
          botMsg.innerHTML = `
            <div class="message-text">${renderMarkdown(msg.answer)}</div>
            <div class="message-time">${formatTime(msg.time)}</div>
          `;
          messageGroup.appendChild(botMsg);
        }
        
        messagesFragment.appendChild(messageGroup);
      });
      
      messagesContainer.appendChild(messagesFragment);
      scrollToBottom(true);
      setupScrollTracking(messagesContainer);
    }
    
    function scrollToBottom(force = false) {
      const messagesContainer = document.getElementById('messagesContainer');
      if (force || isAutoScrolled) {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        hideScrollDownButton();
        isAutoScrolled = true;
      }
    }
    
    function setupScrollTracking(container) {
      const scrollDownBtn = document.getElementById('scrollDownBtn');
      
      container.addEventListener('scroll', () => {
        const isNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 50;
        
        if (isNearBottom) {
          isAutoScrolled = true;
          hideScrollDownButton();
        } else {
          isAutoScrolled = false;
          showScrollDownButton();
        }
      });
      
      scrollDownBtn.addEventListener('click', () => {
        scrollToBottom(true);
      });
    }
    
    function showScrollDownButton() {
      document.getElementById('scrollDownBtn').classList.add('visible');
    }
    
    function hideScrollDownButton() {
      document.getElementById('scrollDownBtn').classList.remove('visible');
    }
    
    document.getElementById('backButton').addEventListener('click', () => {
      document.getElementById('mainContainer').classList.remove('show-dialog');
      hideScrollDownButton();
    });
    
    document.addEventListener('DOMContentLoaded', loadDialogs);
  </script>
</body>
</html>
