<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Диалоги с ботом</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f8f8;
    }
    .container {
      display: flex;
      height: 100vh;
    }
    .users-list {
      width: 30%;
      background: white;
      border-right: 1px solid #e2e2e2;
      overflow-y: auto;
    }
    .dialog-container {
      width: 70%;
      display: flex;
      flex-direction: column;
    }
    .user-item {
      padding: 12px 16px;
      border-bottom: 1px solid #e2e2e2;
      cursor: pointer;
    }
    .user-item:hover {
      background-color: #f5f5f5;
    }
    .user-item.active {
      background-color: #e3f2fd;
    }
    .messages {
      flex-grow: 1;
      padding: 16px;
      overflow-y: auto;
    }
    .message {
      margin-bottom: 12px;
      max-width: 80%;
    }
    .user-message {
      margin-left: auto;
      background: #e3f2fd;
      padding: 8px 12px;
      border-radius: 12px 12px 0 12px;
    }
    .bot-message {
      margin-right: auto;
      background: white;
      padding: 8px 12px;
      border-radius: 12px 12px 12px 0;
      border: 1px solid #e2e2e2;
    }
    .time {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="users-list" id="usersList"></div>
    <div class="dialog-container">
      <div class="messages" id="messagesContainer"></div>
    </div>
  </div>

  <script>
    const webApp = Telegram.WebApp;
    webApp.expand();
    webApp.enableClosingConfirmation();
    
    let dialogs = {};
    let currentUser = null;
    
    async function loadDialogs() {
      try {
        const response = await fetch('https://your-worker-url.workers.dev/api/dialogs');
        dialogs = await response.json();
        renderUserList();
        
        // Если есть пользователи, показываем первого
        const users = Object.keys(dialogs);
        if (users.length > 0) {
          showUserDialog(users[0]);
        }
      } catch (error) {
        console.error('Error loading dialogs:', error);
      }
    }
    
    function renderUserList() {
      const usersList = document.getElementById('usersList');
      usersList.innerHTML = '';
      
      Object.keys(dialogs).forEach(username => {
        const userItem = document.createElement('div');
        userItem.className = `user-item ${username === currentUser ? 'active' : ''}`;
        userItem.textContent = username;
        userItem.addEventListener('click', () => showUserDialog(username));
        usersList.appendChild(userItem);
      });
    }
    
    function showUserDialog(username) {
      currentUser = username;
      renderUserList();
      
      const messagesContainer = document.getElementById('messagesContainer');
      messagesContainer.innerHTML = '';
      
      dialogs[username].forEach(msg => {
        if (msg.prompt) {
          const userMsg = document.createElement('div');
          userMsg.className = 'message user-message';
          userMsg.textContent = msg.prompt;
          
          const time = document.createElement('div');
          time.className = 'time';
          time.textContent = formatTime(msg.time);
          
          userMsg.appendChild(time);
          messagesContainer.appendChild(userMsg);
        }
        
        if (msg.answer) {
          const botMsg = document.createElement('div');
          botMsg.className = 'message bot-message';
          botMsg.textContent = msg.answer;
          
          const time = document.createElement('div');
          time.className = 'time';
          time.textContent = formatTime(msg.time);
          
          botMsg.appendChild(time);
          messagesContainer.appendChild(botMsg);
        }
      });
      
      // Прокрутка вниз
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    function formatTime(timestamp) {
      if (!timestamp) return '';
      const date = new Date(timestamp);
      return date.toLocaleString();
    }
    
    // Инициализация при загрузке
    document.addEventListener('DOMContentLoaded', loadDialogs);
  </script>
</body>
</html>
